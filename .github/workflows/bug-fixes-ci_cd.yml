name: Deploy from NPM to Server

on:
  workflow_dispatch: # manual trigger
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: 20

      - name: 🔐 Configure NPM auth
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📦 Install package from NPM
        run: |
          # Replace @your-scope/package-name with your actual package
          mkdir -p ./deployed-package
          cd ./deployed-package
          npm pack /openmrs@latest
          tar -xzf *.tgz --strip-components=1

      - name: 🔑 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy package to server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: 0f319178341c.mylabserver.com
          username: cloud_user
          port: 22
          source: "deployed-package/**"
          target: "/var/www/app"
          rm: true
          recursive: true
          script: |
            cd /var/www/app
            # List files for logging
            ls -lah
            # Restart service
            #sudo systemctl daemon-reload
            #sudo systemctl restart my-app.service
            #sudo systemctl status my-app.service --no-pager
            sudo yarn install --immutable && yarn turbo run build
